name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支上过时的运行直接取消（省 runner 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Version consistency (package.json == CHANGELOG)
        run: node scripts/changelog.mjs check
      - name: Type check
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
